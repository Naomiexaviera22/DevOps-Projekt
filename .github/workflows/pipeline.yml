name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
      - name: Wrapper ausführbar machen
        run: chmod +x mvnw

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build mit Maven
        run: ./mvnw clean package

      - name: Tests ausführen & Coverage prüfen
        run: ./mvnw verify

      - name: Coverage-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Dependencies installieren
        working-directory: frontend
        run: npm ci

      - name: Frontend bauen
        working-directory: frontend
        run: npm run build

      - name: Docker-Image bauen
        run: docker build -t notes-app:latest .

      - name: App über Docker Compose starten
        run: docker compose up -d --build

      - name: Warten bis Backend bereit ist
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8080/notes; then
              echo "Backend läuft!"
              exit 0
            fi
            echo "Warte auf Backend..."
            sleep 3
          done
          echo "Backend ist nicht rechtzeitig gestartet"
          exit 1

      - name: Warten bis Frontend bereit ist
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/; then
              echo "Frontend läuft!"
              exit 0
            fi
            echo "Warte auf Frontend..."
            sleep 3
          done
          echo "Frontend ist nicht rechtzeitig gestartet"
          exit 1

      - name: Container-Logs anzeigen (bei Fehler hilfreich)
        if: failure()
        run: docker compose logs
